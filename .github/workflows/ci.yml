name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web

  evaluator-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: offline_app/requirements-core.txt
      - run: python -m pip install -r offline_app/requirements-core.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/verify_performance_v1.py
      - run: python offline_app/build.py outputs/release/DGraInsight-Offline-Evaluator --zip
