name: Offline Release

on:
  push:
    tags: ['offline-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test current offline runtime
        run: |
          python -m unittest discover -s tests -p test_offline_distribution.py
          python -m unittest discover -s tests -p test_agcrn_source_revision.py
          python -m unittest discover -s tests -p test_evaluation.py
          python -m unittest discover -s tests -p test_thin_adapter.py
      - name: Build downloads
        run: |
          python scripts/build_offline.py outputs/release/DGraInsight-Offline-Evaluator --agcrn-example outputs/release/AGCRN-Adapter --zip
          cd outputs/release
          sha256sum DGraInsight-Offline-Evaluator.zip AGCRN-Adapter.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" outputs/release/*.zip outputs/release/SHA256SUMS.txt --verify-tag --latest --title "DGraInsight Offline Evaluator $GITHUB_REF_NAME" --notes-file docs/OFFLINE_RELEASE_NOTES.md
